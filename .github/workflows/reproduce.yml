name: Reproduce saved paper results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-replay.lock
      - run: python -m pip install -r requirements-replay.lock
      - name: Check raw predictions and regenerate tables and figures
        run: PYTHONPATH=src OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 python scripts/reproduce_paper.py
