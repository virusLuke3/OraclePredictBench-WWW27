[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oraclepredictbench"
version = "0.1.0"
description = "Auditable conditional UMA protocol-resolution prediction benchmark"
requires-python = ">=3.12,<3.13"
dependencies = ["autogluon.tabular[lightgbm]==1.6.1", "matplotlib", "pyyaml", "openai", "huggingface_hub", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
